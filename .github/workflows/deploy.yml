name: Check & Deploy

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout git repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install Python dependencies
        run: python -m pip install .[sampling,plotting] --group test

      - name: Test with pytest
        run: python -m pytest

      - name: Verify release version matches source code version
        shell: bash
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          SRC_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [[ "${TAG_VERSION}" != "${SRC_VERSION}" ]] ; then
            echo "tag/release version (${TAG_VERSION}) and source code version (${SRC_VERSION}) disagree, exiting"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build --outdir dist/
          python -m twine check --strict dist/*

      - name: Test installing the wheel
        shell: bash
        run: python -m pip install --force-reinstall dist/flavio-*.whl

      - name: Upload build as artifact
        uses: actions/upload-artifact@v7
        with:
          name: flavio-dist
          path: dist

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/flavio/
    permissions:
      id-token: write  # for PyPI Trusted Publishing
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: flavio-dist
          path: dist

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

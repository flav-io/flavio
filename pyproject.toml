[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flavio"
version = "2.7.1"
authors = [
    {name = "David M. Straub", email = "straub@protonmail.com"},
]
description = "A Python package for flavour physics phenomenology in the Standard Model and beyond"
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
license-files = ["LICENSE.txt"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.20.0",
    "scipy",
    "pyyaml",
    "ckmutil>=1.2.0",
    "wilson>=2.5",
    "particle>=1.0.0",
    "parton>=0.2.1",
]

[project.optional-dependencies]
testing = ["pytest"]
plotting = ["matplotlib>=2.0"]
sampling = ["iminuit>=2.0"]

[project.urls]
Homepage = "https://flav-io.github.io"
Documentation = "https://flav-io.github.io/docs/"
Source = "https://github.com/flav-io/flavio"
Issues = "https://github.com/flav-io/flavio/issues"

[dependency-groups]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["flavio*"]

[tool.setuptools.package-data]
flavio = [
    "data/*.yml",
    "data/test/*",
    "physics/data/arXiv-0810-4077v3/*",
    "physics/data/arXiv-1503-05534v1/*",
    "physics/data/arXiv-1503-05534v2/*",
    "physics/data/arXiv-1501-00367v2/*",
    "physics/data/arXiv-1602-01399v1/*",
    "physics/data/arXiv-1811-00983v1/*",
    "physics/data/arXiv-2102.07233v2/*",
    "physics/data/arXiv-2305-06301v1/*",
    "physics/data/qcdf_interpolate/*",
    "physics/data/wcsm/*",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["flavio"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.coverage.run]
source = ["flavio"]

[tool.coverage.report]
omit = ["flavio/physics/bdecays/bvll/_qcdf_interpolate_write.py"]
